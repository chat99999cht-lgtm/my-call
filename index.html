  <style>
    /* Privacy & Anti-Copy Protection CSS */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: #0f172a; 
      color: #f8fafc; 
      padding: 10px; 
      padding-bottom: 90px;
    }
    
    /* Splash Screen */
    #splashScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; transition: opacity 0.5s ease; }
    .splash-card { position: relative; background: rgba(30, 41, 59, 0.7); border: 2px solid #22c55e; border-radius: 24px; padding: 35px 25px; width: 100%; max-width: 360px; box-shadow: 0 0 40px rgba(34, 197, 94, 0.4); display: flex; flex-direction: column; align-items: center; gap: 15px; backdrop-filter: blur(10px); animation: splashPulse 1.5s infinite alternate; }
    @keyframes splashPulse { 0% { transform: scale(1); box-shadow: 0 0 25px rgba(34, 197, 94, 0.3); } 100% { transform: scale(1.03); box-shadow: 0 0 50px rgba(34, 197, 94, 0.6); } }
    .splash-logo-circle { width: 80px; height: 80px; background: linear-gradient(135deg, #22c55e, #15803d); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 36px; box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6); animation: bounceLogo 1s infinite alternate; }
    @keyframes bounceLogo { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

    .splash-btn-group { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 10px; }
    .splash-btn { width: 100%; padding: 12px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .splash-btn-user { background: #22c55e; color: #0f172a; }
    .splash-btn-admin { background: #38bdf8; color: #0f172a; }

    .pwa-install-round-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #0f172a;
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      z-index: 10;
    }

    /* Top Bar Styling */
    .top-slider { height: 75px; background: rgba(34, 197, 94, 0.12); border: 2px solid #22c55e; border-radius: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
    .calling-man-icon { font-size: 24px; margin-right: 6px; color: #38bdf8; }
    .slider-track { flex: 1; overflow: hidden; display: flex; align-items: center; }
    .slider-text { font-size: 14px; font-weight: bold; color: #22c55e; }

    .menu-round-btn { width: 38px; height: 38px; border-radius: 50%; background: #1e293b; border: 1.5px solid #22c55e; color: #38bdf8; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .menu-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); z-index: 99999; justify-content: flex-end; }
    .menu-drawer { width: 260px; height: 100%; background: #1e293b; border-left: 2px solid #38bdf8; padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; }

    .pin-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); z-index: 1000000; align-items: center; justify-content: center; padding: 20px; }
    .pin-card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px; padding: 35px 20px 25px; width: 100%; max-width: 320px; text-align: center; }
    .pin-input { width: 100%; padding: 10px; font-size: 22px; letter-spacing: 8px; text-align: center; background: #0f172a; border: 2px solid #334155; color: #22c55e; border-radius: 8px; outline: none; }

    .dutyoff-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 2000000; align-items: center; justify-content: center; padding: 20px; }
    .dutyoff-card { background: #1e293b; border: 2px solid #ef4444; border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 340px; text-align: center; }

    textarea, input { user-select: text !important; }
    #toast { position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #0f172a; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 12px; z-index: 100000; display: none; }

<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

  <!-- Security & Protection Scripts -->
  <script>
    // 1. Disable DevTools Shortcuts & Key combos
    document.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) || 
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
        alert("Aapka source code secured hai, inspection allowed nahi hai!");
        return false;
      }
    });

    // 2. Debugger trap to prevent inspection via Console
    setInterval(function() {
      const before = new Date().getTime();
      debugger;
      const after = new Date().getTime();
      if (after - before > 100) {
        document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:20vh;'>Developer Tools Detected! Access Blocked.</h2>";
      }
    }, 1000);
  </script>

  <!-- Splash Screen -->
  <div id="splashScreen">
    <div class="splash-card">
      <button class="pwa-install-round-btn" onclick="triggerPWAInstall()" title="Add App to Home Screen">
        <i class="fas fa-download"></i>
      </button>
      <div class="splash-logo-circle"><i class="fas fa-headset"></i></div>
      <div>
        <h2 style="font-size: 20px; color: #22c55e; font-weight: bold;">Auto Dialer & Lead Manager</h2>
        <p style="font-size: 11px; color: #94a3b8;">Smart Calling & Admin Portal (Secured)</p>
      </div>
      <div class="splash-btn-group">
        <button class="splash-btn splash-btn-user" onclick="triggerUserLoginModal()"><i class="fas fa-user"></i> User Login</button>
        <button class="splash-btn splash-btn-admin" onclick="triggerAdminLoginModal()"><i class="fas fa-user-shield"></i> Admin Login</button>
      </div>
    </div>
  </div>

  <div id="toast"><span>Done!</span></div>

  <script>
    // App Logic Placeholders
    function triggerPWAInstall() { alert("PWA install triggered."); }
    function triggerUserLoginModal() { alert("User Login"); }
    function triggerAdminLoginModal() { alert("Admin Login"); }
  </script>
</body>
